<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" width="760" height="290" role="img" aria-labelledby="ablation-title ablation-desc">
  <title id="ablation-title">Which change earned the accuracy gain</title>
  <desc id="ablation-desc">On 200 held-out questions, the baseline scores 86 percent. Adding only the one-line Issue.state enum documentation reaches 94 percent. The eight retained changes without that line reach 94.5 percent, and both together reach 94 percent. The single line accounts for essentially the whole gain.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .title { font-size: 15px; font-weight: 600; fill: #111827; }
    .sub   { font-size: 12px; fill: #6b7280; }
    .lab   { font-size: 12.5px; fill: #374151; }
    .sublab{ font-size: 10.5px; fill: #9ca3af; }
    .val   { font-size: 13px; font-weight: 600; fill: #111827; }
    .ref   { stroke: #2563eb; stroke-width: 1; stroke-dasharray: 4 3; opacity: 0.55; }
    .note  { font-size: 11.5px; fill: #374151; }
    .quiet { font-size: 11.5px; fill: #9ca3af; }
    @media (prefers-color-scheme: dark) {
      .title, .val { fill: #f3f4f6; }
      .lab, .note { fill: #d1d5db; }
      .sub, .sublab, .quiet { fill: #9ca3af; }
    }
  </style>

  <text class="title" x="0" y="18">Which change earned the accuracy gain</text>
  <text class="sub" x="0" y="35">200 held-out questions · four repositories · solved = majority of 3 attempts</text>

  <line class="ref" x1="538.4" y1="52" x2="538.4" y2="238"/>

  <text class="lab"    x="190" y="72" text-anchor="end">baseline</text>
  <rect x="200" y="58" width="309.6" height="22" rx="3" fill="#9ca3af"/>
  <text class="val" x="515.6" y="74">86.00%</text>

  <text class="lab"    x="190" y="112" text-anchor="end">+ the one enum line</text>
  <text class="sublab" x="190" y="125" text-anchor="end">nothing else changed</text>
  <rect x="200" y="102" width="338.4" height="22" rx="3" fill="#2563eb"/>
  <text class="val" x="544.4" y="118">94.00%</text>

  <text class="lab"    x="190" y="156" text-anchor="end">the eight retained changes</text>
  <text class="sublab" x="190" y="169" text-anchor="end">without the enum line</text>
  <rect x="200" y="146" width="340.2" height="22" rx="3" fill="#93c5fd"/>
  <text class="val" x="546.2" y="162">94.50%</text>

  <text class="lab"    x="190" y="200" text-anchor="end">both</text>
  <rect x="200" y="190" width="338.4" height="22" rx="3" fill="#93c5fd"/>
  <text class="val" x="544.4" y="206">94.00%</text>

  <text class="note"  x="0" y="252">baseline → one enum line</text>
  <text class="note"  x="200" y="252" font-weight="600">+8.00pp</text>
  <text class="quiet" x="268" y="252">16 questions gained, 0 lost · McNemar exact p = 3.05e-5</text>

  <text class="note"  x="0" y="272">one enum line → + all eight</text>
  <text class="note"  x="200" y="272" font-weight="600">+0.50pp</text>
  <text class="quiet" x="268" y="272">1 gained, 0 lost · p = 1.0000 · and that one is judge-graded</text>
</svg>
