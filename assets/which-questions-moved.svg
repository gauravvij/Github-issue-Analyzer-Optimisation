<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-labelledby="strata-title strata-desc">
  <title id="strata-title">Which kinds of question actually moved</title>
  <desc id="strata-desc">Per-stratum accuracy on 200 held-out questions across four repositories. Documenting the Issue.state enum fixed state questions and their paraphrases. A later fix for free-text casing and path anchoring fixed label and multi-hop questions. Five other strata were already at 100 percent and are not shown.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .title { font-size: 15px; font-weight: 600; fill: #111827; }
    .sub   { font-size: 12px; fill: #6b7280; }
    .lab   { font-size: 12.5px; fill: #374151; }
    .n     { font-size: 10.5px; fill: #9ca3af; }
    .val   { font-size: 10.5px; fill: #6b7280; }
    .key   { font-size: 11px; fill: #374151; }
    .rule  { stroke: #e5e7eb; stroke-width: 1; }
    @media (prefers-color-scheme: dark) {
      .title { fill: #f3f4f6; }
      .lab, .key { fill: #d1d5db; }
      .sub, .val { fill: #9ca3af; }
      .n { fill: #6b7280; }
      .rule { stroke: #374151; }
    }
  </style>

  <text class="title" x="0" y="18">Which kinds of question actually moved</text>
  <text class="sub" x="0" y="35">200 held-out questions across sympy, scikit-learn, matplotlib and requests · solved = majority of 3 attempts</text>

  <rect x="162" y="46" width="10" height="10" rx="2" fill="#9ca3af"/>
  <text class="key" x="177" y="55">before the campaign</text>
  <rect x="300" y="46" width="10" height="10" rx="2" fill="#93c5fd"/>
  <text class="key" x="315" y="55">+ Issue.state enum documented</text>
  <rect x="510" y="46" width="10" height="10" rx="2" fill="#2563eb"/>
  <text class="key" x="525" y="55">+ free-text casing and path anchoring</text>

  <line class="rule" x1="162" y1="66" x2="640" y2="66"/>

  <!-- enum_state  n=28 -->
  <text class="lab" x="150" y="88" text-anchor="end">enum_state</text>
  <text class="n"   x="150" y="101" text-anchor="end">n = 28</text>
  <rect x="162" y="74"  width="358.5" height="11" rx="2" fill="#9ca3af"/><text class="val" x="526.5" y="83">75%</text>
  <rect x="162" y="87"  width="478.0" height="11" rx="2" fill="#93c5fd"/>
  <rect x="162" y="100" width="478.0" height="11" rx="2" fill="#2563eb"/><text class="val" x="646" y="109">100%</text>

  <!-- paraphrase  n=16 -->
  <text class="lab" x="150" y="139" text-anchor="end">paraphrase</text>
  <text class="n"   x="150" y="152" text-anchor="end">n = 16</text>
  <rect x="162" y="125" width="268.9" height="11" rx="2" fill="#9ca3af"/><text class="val" x="436.9" y="134">56%</text>
  <rect x="162" y="138" width="478.0" height="11" rx="2" fill="#93c5fd"/>
  <rect x="162" y="151" width="478.0" height="11" rx="2" fill="#2563eb"/><text class="val" x="646" y="160">100%</text>

  <line class="rule" x1="162" y1="176" x2="640" y2="176"/>

  <!-- label  n=20 -->
  <text class="lab" x="150" y="198" text-anchor="end">label</text>
  <text class="n"   x="150" y="211" text-anchor="end">n = 20</text>
  <rect x="162" y="184" width="382.4" height="11" rx="2" fill="#9ca3af"/>
  <rect x="162" y="197" width="382.4" height="11" rx="2" fill="#93c5fd"/><text class="val" x="550.4" y="206">80%</text>
  <rect x="162" y="210" width="478.0" height="11" rx="2" fill="#2563eb"/><text class="val" x="646" y="219">100%</text>

  <!-- multi_hop  n=16 -->
  <text class="lab" x="150" y="249" text-anchor="end">multi_hop</text>
  <text class="n"   x="150" y="262" text-anchor="end">n = 16</text>
  <rect x="162" y="235" width="268.9" height="11" rx="2" fill="#9ca3af"/>
  <rect x="162" y="248" width="268.9" height="11" rx="2" fill="#93c5fd"/><text class="val" x="436.9" y="257">56%</text>
  <rect x="162" y="261" width="478.0" height="11" rx="2" fill="#2563eb"/><text class="val" x="646" y="270">100%</text>

  <line class="rule" x1="162" y1="286" x2="640" y2="286"/>

  <!-- author  n=16 -->
  <text class="lab" x="150" y="308" text-anchor="end">author</text>
  <text class="n"   x="150" y="321" text-anchor="end">n = 16</text>
  <rect x="162" y="294" width="418.3" height="11" rx="2" fill="#9ca3af"/><text class="val" x="586.3" y="303">88%</text>
  <rect x="162" y="307" width="448.1" height="11" rx="2" fill="#93c5fd"/>
  <rect x="162" y="320" width="478.0" height="11" rx="2" fill="#2563eb"/><text class="val" x="646" y="329">100%</text>

  <text class="sub" x="0" y="360">Five further strata — counts, dates, text search, true zeros and the two canaries — were at 100% for every version and are not plotted.</text>
  <text class="sub" x="0" y="378">The first fix was one line naming the values of one field. The second stated two general rules about the same kind of mistake.</text>
</svg>
