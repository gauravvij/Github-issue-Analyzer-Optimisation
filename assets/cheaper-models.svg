<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 230" width="760" height="230" role="img" aria-label="Can a cheaper model answer the questions?">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .title { font-size: 15px; font-weight: 600; fill: #111827; }
    .sub   { font-size: 12px; fill: #6b7280; }
    .lab   { font-size: 13px; fill: #374151; }
    .val   { font-size: 13px; font-weight: 600; fill: #111827; }
    .valin { font-size: 13px; font-weight: 600; fill: #ffffff; }
    .rule  { stroke: #d1d5db; stroke-width: 1; }
    .ref   { stroke: #9ca3af; stroke-width: 1; stroke-dasharray: 4 3; }
    .reflab{ font-size: 11px; fill: #6b7280; }
    .whisk { stroke: #6b7280; stroke-width: 1.5; }
    .wlab  { font-size: 10.5px; fill: #6b7280; }
    @media (prefers-color-scheme: dark) {
      .title, .val { fill: #f3f4f6; }
      .lab { fill: #d1d5db; }
      .sub, .reflab { fill: #9ca3af; }
      .rule { stroke: #4b5563; }
      .ref  { stroke: #6b7280; }
      .whisk{ stroke: #9ca3af; }
      .wlab { fill: #9ca3af; }
    }
  </style>
<text class="title" x="0" y="18">Can a cheaper model answer the questions?</text>
<text class="sub" x="0" y="35">Deterministic accuracy, QA agent swapped, same graph, 3 runs each</text>
<line class="ref" x1="677.4" y1="40" x2="677.4" y2="186"/>
<text class="reflab" x="677.4" y="35" text-anchor="middle">bar: 97.14%</text>
<text class="lab" x="238" y="62" text-anchor="end">gpt-4o  (shipped)</text>
<rect x="250" y="48" width="440.0" height="20" rx="3" fill="#2563eb"/>
<text class="valin" x="681.0" y="62" text-anchor="end">100.00% · ACCEPT</text>
<text class="lab" x="238" y="112" text-anchor="end">gpt-4o-mini</text>
<rect x="250" y="98" width="421.8" height="20" rx="3" fill="#dc2626"/>
<line class="whisk" x1="660.7" y1="125.0" x2="685.8" y2="125.0"/>
<line class="whisk" x1="660.7" y1="121.5" x2="660.7" y2="128.5"/>
<line class="whisk" x1="685.8" y1="121.5" x2="685.8" y2="128.5"/>
<text class="valin" x="662.8" y="112" text-anchor="end">95.87% · REJECT</text>
<text class="lab" x="238" y="162" text-anchor="end">gpt-4.1-mini</text>
<rect x="250" y="148" width="335.2" height="20" rx="3" fill="#dc2626"/>
<line class="whisk" x1="581.1" y1="175.0" x2="589.4" y2="175.0"/>
<line class="whisk" x1="581.1" y1="171.5" x2="581.1" y2="178.5"/>
<line class="whisk" x1="589.4" y1="171.5" x2="589.4" y2="178.5"/>
<text class="val" x="594.2" y="162">76.19% · REJECT</text>
<text class="sub" x="0" y="222">Whiskers = run-to-run range. gpt-4o-mini 93.33–99.05, a 5.71-point swing; gpt-4.1-mini 75.24–77.14. The shipped model had zero spread.</text>
</svg>
