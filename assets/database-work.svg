<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" width="760" height="280" role="img" aria-labelledby="database-title database-desc">
  <title id="database-title">Database work per ingestion</title>
  <desc id="database-desc">Neo4j queries fell from 698 to 255, and database sessions fell from 122 to 4.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .title { font-size: 15px; font-weight: 600; fill: #111827; }
    .sub   { font-size: 12px; fill: #6b7280; }
    .lab   { font-size: 13px; fill: #374151; }
    .val   { font-size: 13px; font-weight: 600; fill: #111827; }
    .valin { font-size: 13px; font-weight: 600; fill: #ffffff; }
    .rule  { stroke: #d1d5db; stroke-width: 1; }
    .ref   { stroke: #9ca3af; stroke-width: 1; stroke-dasharray: 4 3; }
    .reflab{ font-size: 11px; fill: #6b7280; }
    .whisk { stroke: #6b7280; stroke-width: 1.5; }
    .wlab  { font-size: 10.5px; fill: #6b7280; }
    @media (prefers-color-scheme: dark) {
      .title, .val { fill: #f3f4f6; }
      .lab { fill: #d1d5db; }
      .sub, .reflab { fill: #9ca3af; }
      .rule { stroke: #4b5563; }
      .ref  { stroke: #6b7280; }
      .whisk{ stroke: #9ca3af; }
      .wlab { fill: #9ca3af; }
    }
  </style>
<text class="title" x="0" y="18">Database work per ingestion</text>
<text class="sub" x="0" y="35">Same 60-issue corpus, same 121 GitHub requests, same 60 OpenAI calls</text>
<text class="lab" x="238" y="62" text-anchor="end">Neo4j queries — before</text>
<rect x="250" y="48" width="404.1" height="20" rx="3" fill="#9ca3af"/>
<text class="val" x="663.1" y="62">698</text>
<text class="lab" x="238" y="112" text-anchor="end">Neo4j queries — after</text>
<rect x="250" y="98" width="147.6" height="20" rx="3" fill="#2563eb"/>
<text class="val" x="406.6" y="112">255 · −63.5%</text>
<text class="lab" x="238" y="162" text-anchor="end">Neo4j sessions — before</text>
<rect x="250" y="148" width="70.6" height="20" rx="3" fill="#9ca3af"/>
<text class="val" x="329.6" y="162">122</text>
<text class="lab" x="238" y="212" text-anchor="end">Neo4j sessions — after</text>
<rect x="250" y="198" width="2.3" height="20" rx="3" fill="#2563eb"/>
<text class="val" x="261.3" y="212">4 · −96.7%</text>
<text class="sub" x="0" y="272">Batched into a single managed transaction, with 10 uniqueness constraints and 12 indexes added.</text>
</svg>
