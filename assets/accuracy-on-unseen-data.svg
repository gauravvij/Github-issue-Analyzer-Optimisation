<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 180" width="760" height="180" role="img" aria-labelledby="accuracy-title accuracy-desc">
  <title id="accuracy-title">Deterministic accuracy on an unseen corpus</title>
  <desc id="accuracy-desc">The baseline averaged 94.29 percent across three runs. The optimized version scored 100 percent on every run.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .title { font-size: 15px; font-weight: 600; fill: #111827; }
    .sub   { font-size: 12px; fill: #6b7280; }
    .lab   { font-size: 13px; fill: #374151; }
    .val   { font-size: 13px; font-weight: 600; fill: #111827; }
    .valin { font-size: 13px; font-weight: 600; fill: #ffffff; }
    .rule  { stroke: #d1d5db; stroke-width: 1; }
    .ref   { stroke: #9ca3af; stroke-width: 1; stroke-dasharray: 4 3; }
    .reflab{ font-size: 11px; fill: #6b7280; }
    .whisk { stroke: #6b7280; stroke-width: 1.5; }
    .wlab  { font-size: 10.5px; fill: #6b7280; }
    @media (prefers-color-scheme: dark) {
      .title, .val { fill: #f3f4f6; }
      .lab { fill: #d1d5db; }
      .sub, .reflab { fill: #9ca3af; }
      .rule { stroke: #4b5563; }
      .ref  { stroke: #6b7280; }
      .whisk{ stroke: #9ca3af; }
      .wlab { fill: #9ca3af; }
    }
  </style>
<text class="title" x="0" y="18">Deterministic accuracy on a corpus it had never seen</text>
<text class="sub" x="0" y="35">100 sympy/sympy issues selected by SWE-bench · mean of 3 runs x 3 attempts · 360 graded attempts per version</text>
<text class="lab" x="238" y="62" text-anchor="end">baseline</text>
<rect x="250" y="48" width="414.9" height="20" rx="3" fill="#9ca3af"/>
<line class="whisk" x1="656.5" y1="75.0" x2="669.1" y2="75.0"/>
<line class="whisk" x1="656.5" y1="71.5" x2="656.5" y2="78.5"/>
<line class="whisk" x1="669.1" y1="71.5" x2="669.1" y2="78.5"/>
<text class="val" x="673.9" y="62">94.29%</text>
<text class="lab" x="238" y="112" text-anchor="end">after optimisation</text>
<rect x="250" y="98" width="440.0" height="20" rx="3" fill="#2563eb"/>
<text class="val" x="699.0" y="112">100.00%</text>
<text class="sub" x="0" y="172">Whisker = range across the three baseline runs (92.38–95.24). The optimised version had zero spread — 100.00% on every run.</text>
</svg>
