<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 230" width="760" height="230" role="img" aria-label="Where the 203 seconds of ingestion actually went">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .title { font-size: 15px; font-weight: 600; fill: #111827; }
    .sub   { font-size: 12px; fill: #6b7280; }
    .lab   { font-size: 13px; fill: #374151; }
    .val   { font-size: 13px; font-weight: 600; fill: #111827; }
    .valin { font-size: 13px; font-weight: 600; fill: #ffffff; }
    .rule  { stroke: #d1d5db; stroke-width: 1; }
    .ref   { stroke: #9ca3af; stroke-width: 1; stroke-dasharray: 4 3; }
    .reflab{ font-size: 11px; fill: #6b7280; }
    .whisk { stroke: #6b7280; stroke-width: 1.5; }
    .wlab  { font-size: 10.5px; fill: #6b7280; }
    @media (prefers-color-scheme: dark) {
      .title, .val { fill: #f3f4f6; }
      .lab { fill: #d1d5db; }
      .sub, .reflab { fill: #9ca3af; }
      .rule { stroke: #4b5563; }
      .ref  { stroke: #6b7280; }
      .whisk{ stroke: #9ca3af; }
      .wlab { fill: #9ca3af; }
    }
  </style>
<text class="title" x="0" y="18">Where the 203 seconds of ingestion actually went</text>
<text class="sub" x="0" y="35">Baseline run, measured from OpenTelemetry spans</text>
<text class="lab" x="238" y="62" text-anchor="end">OpenAI (60 calls)</text>
<rect x="250" y="48" width="403.5" height="20" rx="3" fill="#d97706"/>
<text class="valin" x="644.5" y="62" text-anchor="end">183.4 s · 90.1%</text>
<text class="lab" x="238" y="112" text-anchor="end">GitHub (121 calls)</text>
<rect x="250" y="98" width="32.8" height="20" rx="3" fill="#9ca3af"/>
<text class="val" x="291.8" y="112">14.9 s · 7.3%</text>
<text class="lab" x="238" y="162" text-anchor="end">Neo4j (863 queries)</text>
<rect x="250" y="148" width="16.3" height="20" rx="3" fill="#2563eb"/>
<text class="val" x="275.3" y="162">7.4 s · 3.6%</text>
<text class="sub" x="0" y="222">This is why cutting 63% of database work moved wall clock by only 3.7%. Spans overlap, so shares exceed 100%.</text>
</svg>
